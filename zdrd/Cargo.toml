[package]
name = "zdrd"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
zbus = "5"
async-io = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = "=2.0.0-rc.14"
v4l = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
